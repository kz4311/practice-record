<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>練習記録</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#687386;--line:#dfe5ee;--blue:#3978d8;--green:#24a36a;--red:#d9535d;--gold:#d39520}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:23px;margin:0 0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 3px 12px #182b4510}.status{font-size:12px;color:var(--muted);margin:0 0 10px}.rate{font-size:30px;font-weight:800;color:var(--blue)}.rate small{font-size:14px;font-weight:500;color:var(--muted)}button,input{font:inherit}button{border:0;border-radius:10px;min-height:42px;padding:8px 13px;background:#e9eef7;color:var(--ink);font-weight:700}button.primary{background:var(--blue);color:white}button.danger{background:#fff0f1;color:var(--red)}button:disabled{opacity:.45}.month{display:flex;justify-content:space-between;align-items:center}.month strong{font-size:19px}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week{margin:14px 0 6px;color:var(--muted);font-size:12px;text-align:center}.day{min-height:58px;background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:5px;text-align:left;position:relative}.day.empty{background:transparent;border:0}.day .num{font-size:13px}.day .mark{display:block;text-align:center;font-size:22px;line-height:25px}.day.done{border-color:#9ddabc;background:#f1fbf6}.day.penalty{border-color:#efb1b6;background:#fff6f6}.day.future{opacity:.5}.detail h2{margin:0 0 4px}.back{margin-bottom:8px}.menu{list-style:none;padding:0;margin:12px 0}.menu li{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:11px 0}.menu input[type=checkbox]{width:24px;height:24px;accent-color:var(--green)}.menu label{flex:1}.signbox{background:#f7f9fc;padding:12px;border-radius:12px}.signbox input,.master input{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:white}.note{font-size:12px;color:var(--muted);line-height:1.5}.reason{width:100%;min-height:70px;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit}.hidden{display:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.master-row{display:flex;gap:8px;margin:8px 0}.master-row input{flex:1}.saved{font-size:12px;color:var(--green);min-height:18px}
</style></head><body><main>
<div id="app"></div>
<script>
const KEY='practice-record-v1',DEFAULT=['基礎練習 1','基礎練習 2','基礎練習 3','基礎練習 4','基礎練習 5','基礎練習 6','基礎練習 7','基礎練習 8','基礎練習 9','基礎練習 10'];
let storageOK=true,store={master:DEFAULT.slice(),days:{}};
try{const raw=localStorage.getItem(KEY);if(raw)store=Object.assign(store,JSON.parse(raw));localStorage.setItem(KEY,JSON.stringify(store))}catch(e){storageOK=false}
let view={page:'calendar',month:new Date().getMonth(),year:new Date().getFullYear(),date:null};
function save(){if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(store));document.querySelector('.saved').textContent='保存済み'}catch(e){storageOK=false;render()}}
function key(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function today(){let n=new Date();return key(n.getFullYear(),n.getMonth(),n.getDate())}
function dayData(k){return store.days[k]||(store.days[k]={checks:Array(10).fill(false),signed:'',reason:''})}
function isPast(y,m,d){return key(y,m,d)<today()}
function complete(d){return d.checks.length===10&&d.checks.every(Boolean)&&!!d.signed}
function render(){view.page==='calendar'?calendar():view.page==='detail'?detail():master()}
function calendar(){let first=new Date(view.year,view.month,1).getDay(),last=new Date(view.year,view.month+1,0).getDate(),total=0;for(let d=1;d<=last;d++)if(complete(dayData(key(view.year,view.month,d))))total++;let rate=Math.round(total/last*100);let cells='';for(let i=0;i<first;i++)cells+='<div class="day empty"></div>';for(let d=1;d<=last;d++){let k=key(view.year,view.month,d),x=dayData(k),done=complete(x),bad=isPast(view.year,view.month,d)&&!done;cells+=`<button class="day ${done?'done':''} ${bad?'penalty':''} ${k>today()?'future':''}" onclick="openDay('${k}')"><span class="num">${d}</span><span class="mark">${done?'○':bad?(x.reason?'△':'×'):''}</span></button>`}document.getElementById('app').innerHTML=`<div class="head"><h1>練習記録</h1><button onclick="view.page='master';render()">メニュー管理</button></div><section class="card"><div class="status">${storageOK?'このiPadに保存できます':'保存できません（この画面を開いている間は操作できます）'}</div><div class="rate">${rate}% <small>月間達成率（${total}/${last}日）</small></div></section><section class="card"><div class="month"><button onclick="move(-1)">‹</button><strong>${view.year}年${view.month+1}月</strong><button onclick="move(1)">›</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="cal">${cells}</div><p class="note">○：達成　×：未完了　△：未完了だが理由提出済み</p></section><p class="saved"></p>`}
function move(n){let x=new Date(view.year,view.month+n,1);view.year=x.getFullYear();view.month=x.getMonth();render()}
function openDay(k){view.date=k;view.page='detail';render()}
function detail(){let d=dayData(view.date),done=d.checks.every(Boolean),signed=!!d.signed,bad=view.date<today()&&!complete(d);document.getElementById('app').innerHTML=`<button class="back" onclick="view.page='calendar';render()">← カレンダーへ</button><section class="card detail"><h2>${view.date} の練習</h2><p class="status">${complete(d)?'達成済み':bad?'未完了のため理由を入力してください':''}</p><ul class="menu">${store.master.map((name,i)=>`<li><input id="c${i}" type="checkbox" ${d.checks[i]?'checked':''} onchange="toggle(${i},this.checked)"><label for="c${i}">${i+1}. ${esc(name)}</label></li>`).join('')}</ul><div class="signbox"><b>サイン</b><p class="note">10項目すべて完了したら、確認者の名前を入力してください。</p><div style="display:flex;gap:8px;align-items:center"><input id="sign" style="flex:1" placeholder="確認者の名前" value="${esc(d.signed)}" onchange="sign(this.value)" ${!done?'disabled':''}><button class="primary" onclick="finishDay()" ${!done||!signed?'disabled':''}>練習完了</button></div></div>${bad?`<div class="signbox" style="margin-top:10px"><b>未実施の理由</b><textarea class="reason" placeholder="理由を入力してください" onchange="reason(this.value)">${esc(d.reason)}</textarea><p class="note">理由を入力すると、カレンダーの×を△として扱います。</p></div>`:''}</section><p class="saved"></p>`}
function toggle(i,v){dayData(view.date).checks[i]=v;save();render()};function sign(v){let d=dayData(view.date);d.signed=v.trim();save();render()};function reason(v){dayData(view.date).reason=v;save()};function finishDay(){if(!complete(dayData(view.date)))return;save();view.page='calendar';render()}
function master(){document.getElementById('app').innerHTML=`<button class="back" onclick="view.page='calendar';render()">← カレンダーへ</button><section class="card master"><h2>練習メニューのマスター更新</h2><p class="note">ここで変更した内容は、これから開く日のメニューに反映されます。過去日の記録内容は変わりません。</p>${store.master.map((x,i)=>`<div class="master-row"><span>${i+1}.</span><input id="m${i}" value="${esc(x)}"></div>`).join('')}<div class="toolbar"><button class="primary" onclick="updateMaster()">マスターを保存</button><button onclick="store.master=DEFAULT.slice();render()">初期文言に戻す</button></div></section><p class="saved"></p>`}
function updateMaster(){store.master=store.master.map((_,i)=>document.getElementById('m'+i).value.trim()||('練習項目 '+(i+1)));save();view.page='calendar';render()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></main></body></html>
